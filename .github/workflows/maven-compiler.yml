name: Java CI

on:
  push:
    branches:
    - main
    paths:
    - 'build-parent/**'
    - '.github/workflows/**'
    - 'src/**'
    - 'pom.xml'
  pull_request:
    paths:
    - 'build-parent/**'
    - '.github/workflows/**'
    - 'src/**'
    - 'pom.xml'
    - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  build:

    name: Maven build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # JDK 25 is only for compiling against the Paper 26.x APIs (Java 25 class files).
    # The last version listed, 21, stays the default JAVA_HOME; 25 is exposed as JAVA_HOME_25_X64.
    - name: Set up JDK 25 and 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: |
          25
          21
        java-package: jdk
        architecture: x64

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build production JAR for Paper 1.21.11
      run: mvn package --file pom.xml -DskipTests

    - name: Run stable MockBukkit regression suite
      run: >-
        mvn test --file pom.xml -DlegacyMockBukkitTests
        -Dtest=TestColorCodes,TestSlimefunSpelling,TestDoubleRangeSetting,TestEnumSetting,TestIntRangeSetting,TestItemSettings,TestMaterialTagSetting,TestNetworkManager,TestResearches,TestUpdaterService,TestRechargeableItems

    - name: Check bytecode against Paper API 1.21.11, 26.1 and 26.2
      run: mvn test --file pom.xml -Dtest=TestPaperApiCompatibility

    - name: Compile against Paper API 1.21.11
      run: mvn test --file pom.xml -DpaperApiCompile=true -Dtest='TestPaperApiCompilation#testCompilesAgainstPaper_1_21_11'

    - name: Compile against Paper API 26.1
      run: mvn test --file pom.xml -DpaperApiCompile=true -Dtest='TestPaperApiCompilation#testCompilesAgainstPaper_26_1'

    - name: Compile against Paper API 26.2
      run: mvn test --file pom.xml -DpaperApiCompile=true -Dtest='TestPaperApiCompilation#testCompilesAgainstPaper_26_2'

    - name: Upload production artifact
      uses: actions/upload-artifact@v4
      with:
        name: slimefun-core-${{ github.sha }}
        path: 'target/Slimefun-1.2.DEV v11.0-Drake-1.21.11-SNAPSHOT.jar'
